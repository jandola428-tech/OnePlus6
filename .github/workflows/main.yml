name: Build OnePlus 6T kernel (nethunter)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build nethunter kernel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: nethunter
          fetch-depth: 0

      - name: Build kernel
        uses: lemniskett/android-kernel-actions@master
        id: build
        with:
          arch: arm64
          aosp-clang: true
          aosp-clang-version: r383902
          defconfig: nethunter_defconfig
          image: Image.gz-dtb

      - name: Package kernel as AnyKernel3 flashable zip
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_IMG=""
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            KERNEL_IMG="out/arch/arm64/boot/Image.gz-dtb"
          elif [ -f "arch/arm64/boot/Image.gz-dtb" ]; then
            KERNEL_IMG="arch/arm64/boot/Image.gz-dtb"
          else
            KERNEL_IMG="$(find . -type f -name 'Image.gz-dtb' | head -n 1)"
          fi

          if [ -z "${KERNEL_IMG}" ] || [ ! -f "${KERNEL_IMG}" ]; then
            echo "Image.gz-dtb was not found. Build may have failed." >&2
            exit 1
          fi

          git clone --depth 1 -b master https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp "${KERNEL_IMG}" AnyKernel3/Image.gz-dtb

          cd AnyKernel3
          zip -r9 ../nethunter-kernel.zip . -x ".git/*" -x "*.git*"
          cd ..

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-kernel-zip
          path: nethunter-kernel.zip
